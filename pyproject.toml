[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-bc"
version = "1.0.0"
description = "Segmentation-guided self-supervised learning for breast cancer detection on thermal images."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Gabriele Passoni" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "torchmetrics>=1.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "albumentations>=2.0",
    "wandb>=0.16",
    "python-dotenv>=1.0",
    "flyr>=3.3",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7"]
dev = ["ruff>=0.5", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["N801", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
